select,

      }

  display: flex;

}

  gap: 6px;
}

  height: 22px;
}
.page-description {
  margin-top: 6px;
  font-size: 13px;
}
      .card {
        padding: 14px;

.start-field {

}

.end-field {

}

 select,
input,
button {
  height: 38px;
  font-size: 16px;
  padding: 0 6px;

}

input[type="date"] {

}

<body>
  <div id="authScreen" style="
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    background:#f4f7fb;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans KR',Arial,sans-serif;
    color:#1f2937;
    font-size:15px;
    font-weight:700;
  ">
    승인 확인 중...
  </div>

  <div id="appRoot" style="display:none;">
    <div class="container">
<div class="page-header">
  <div class="header-left">
    <h1>FBO Fee Lookup</h1>
    <div class="page-description">
      Signature / Atlantic FBO handling fees, minimum fuel uplift, and special event fees by date.
    </div>
  </div>

  <div class="header-logos">
    <img src="SIGNATURE.jpg" alt="Signature" />
    <img src="ATLANTIC.jpg" alt="Atlantic" />
  </div>
</div>

    <div class="card">
      <div class="form-grid">

        <div class="field model-field">
          <label for="model">기종</label>
          <select id="model">
            <option value="ACJ">ACJ</option>
            <option value="G650">G650</option>
          </select>
        </div>

        <div class="field provider-field">
          <label for="provider">FBO</label>
          <select id="provider">
            <option value="SIGNATURE">SIGNATURE</option>
            <option value="ATLANTIC">ATLANTIC</option>
          </select>
        </div>

        <div class="field icao-field">
          <label for="icao">공항코드</label>
          <input id="icao" type="text" maxlength="4" placeholder="ICAO" />
        </div>

        <div class="field start-field">
          <label for="startDate">시작일</label>
          <input id="startDate" type="date" />
        </div>

        <div class="field end-field">
          <label for="endDate">종료일</label>
          <input id="endDate" type="date" />
        </div>

        <div class="field button-field">
          <button id="searchBtn" onclick="searchFees()">조회</button>
        </div>

      </div>

      <div id="status" class="status"></div>

      <div class="action-row">
<button class="pdf-btn" onclick="downloadPdf()">PDF 추출</button>
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table id="resultTable">
          <thead>
            <tr>
              <th>Date</th>
              <th>ICAO</th>
              <th>FBO</th>
           <th>Aircraft</th>
              <th class="num">Handling Fee</th>
              <th class="num">Minimum Gallon</th>
              <th class="num">Special Event Fee</th>
            </tr>
          </thead>
          <tbody id="resultBody">
            <tr>
              <td colspan="7" class="empty">조회 조건을 입력하세요.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    </div>
  </div>

  <script>
    /****************************************************
     * CONFIG
     ****************************************************/

    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwwXjvZ-jKppJDBhsPwhrsz5IGGNdPDxezNdswhwPzjCHlHaGtyXOFE6uhz2DzPRBM4/exec';

    let currentRows = [];


    /****************************************************
     * INIT
     ****************************************************/

let FBO_FEE_APP_STARTED = false;

function showAuthorizedApp() {
  const authScreen = document.getElementById("authScreen");
  const appRoot = document.getElementById("appRoot");

  if (authScreen) authScreen.style.display = "none";
  if (appRoot) appRoot.style.display = "block";
}
const MAX_RANGE_DAYS = 31;

function initFboFeeApp() {
  const today = new Date();

  document.getElementById('startDate').value = toYyyyMmDd(today);
  document.getElementById('endDate').value = toYyyyMmDd(today);

  document.getElementById('startDate').addEventListener('change', function () {
    const startDateValue = this.value;
    if (!startDateValue) return;

    const startDate = parseDateLocal(startDateValue);
    const endDateInput = document.getElementById('endDate');

    // 시작일 선택 시 종료일은 같은 날짜로 기본 설정
    endDateInput.value = startDateValue;

    // 종료일 선택 가능 범위 제한: 시작일 ~ 시작일+31
    endDateInput.min = startDateValue;
endDateInput.max = toYyyyMmDd(addDays(startDate, MAX_RANGE_DAYS - 1));
  });

  document.getElementById('endDate').addEventListener('change', function () {
    const startDateValue = document.getElementById('startDate').value;
    const endDateValue = this.value;

    if (!startDateValue || !endDateValue) return;

    const startDate = parseDateLocal(startDateValue);
const maxEndDate = addDays(startDate, MAX_RANGE_DAYS - 1);
    const maxEndDateValue = toYyyyMmDd(maxEndDate);

    if (endDateValue > maxEndDateValue) {
      alert('종료일은 시작일로부터 최대 31일까지만 선택할 수 있습니다.');
      this.value = maxEndDateValue;
    }

    if (endDateValue < startDateValue) {
      alert('종료일은 시작일보다 빠를 수 없습니다.');
      this.value = startDateValue;
    }
  });

  // 최초 로딩 시에도 종료일 범위 설정
  const startDate = parseDateLocal(document.getElementById('startDate').value);
  document.getElementById('endDate').min = document.getElementById('startDate').value;
 document.getElementById('endDate').max = toYyyyMmDd(addDays(startDate, MAX_RANGE_DAYS - 1));
}
    
function startFboFeeAppAfterAuth() {
  if (FBO_FEE_APP_STARTED) return;

  FBO_FEE_APP_STARTED = true;
  showAuthorizedApp();
  initFboFeeApp();
}

(function waitForPortalAuth() {
  if (sessionStorage.getItem("portalApproved") === "true") {
    startFboFeeAppAfterAuth();
    return;
  }

  if (window.CURRENT_PORTAL_USER) {
    sessionStorage.setItem("portalApproved", "true");
    startFboFeeAppAfterAuth();
    return;
  }

  setTimeout(waitForPortalAuth, 200);
})();

    /****************************************************
     * MAIN SEARCH
     ****************************************************/

    async function searchFees() {
      const input = getInputValues();

      if (!validateInput(input)) return;

      const btn = document.getElementById('searchBtn');
      const url = buildRequestUrl(input);

      btn.disabled = true;
      setStatus('조회 중입니다...', '');
      renderRows([], input);

      try {
        const json = await jsonpRequest(url);

        if (!json.ok) {
          throw new Error(json.error || 'Unknown error');
        }

        renderRows(json.rows || [], input);

        if (json.cached) {
          setStatus(
            `${json.count || 0}건 조회 완료 <span class="badge cache-badge">Cached</span>`,
            'ok'
          );
        } else {
          setStatus(
            `${json.count || 0}건 조회 완료 <span class="badge">Live</span>`,
            'ok'
          );
        }

      } catch (err) {
        setStatus(err.message, 'error');
        renderError(err.message);

      } finally {
        btn.disabled = false;
      }
    }


    /****************************************************
     * JSONP REQUEST
     ****************************************************/

    function jsonpRequest(baseUrl) {
      return new Promise((resolve, reject) => {
        const callbackName =
          'jsonpCallback_' +
          Date.now() +
          '_' +
          Math.floor(Math.random() * 1000000);

        const separator = baseUrl.includes('?') ? '&' : '?';
        const url = baseUrl + separator + 'callback=' + encodeURIComponent(callbackName);

        const script = document.createElement('script');

        const timer = setTimeout(() => {
          cleanup();
          reject(new Error('Request timeout'));
        }, 120000);

        function cleanup() {
          clearTimeout(timer);

          try {
            delete window[callbackName];
          } catch (e) {
            window[callbackName] = undefined;
          }

          if (script.parentNode) {
            script.parentNode.removeChild(script);
          }
        }

        window[callbackName] = function (data) {
          cleanup();
          resolve(data);
        };

        script.onerror = function () {
          cleanup();
          reject(new Error('Failed to load Apps Script response'));
        };

        script.src = url;
        document.body.appendChild(script);
      });
    }


    /****************************************************
     * INPUT
     ****************************************************/

    function getInputValues() {
      return {
        model: document.getElementById('model').value.trim().toUpperCase(),
        provider: document.getElementById('provider').value.trim().toUpperCase(),
        icao: document.getElementById('icao').value.trim().toUpperCase(),
        startDate: document.getElementById('startDate').value,
        endDate: document.getElementById('endDate').value
      };
    }

    function validateInput(input) {
      if (!GAS_URL || GAS_URL === 'YOUR_APPS_SCRIPT_WEB_APP_URL_HERE') {
        alert('Apps Script Web App URL을 GAS_URL에 입력하세요.');
        return false;
      }

      if (!input.model) {
        alert('기종을 선택하세요.');
        return false;
      }

      if (!input.provider) {
        alert('FBO를 선택하세요.');
        return false;
      }

      if (!input.icao || input.icao.length !== 4) {
        alert('4 Letter ICAO Code를 입력하세요. 예: KSJC');
        return false;
      }

      if (!input.startDate || !input.endDate) {
        alert('조회기간을 입력하세요.');
        return false;
      }

      if (input.startDate > input.endDate) {
        alert('시작일은 종료일보다 늦을 수 없습니다.');
        return false;
      }
      const startDate = parseDateLocal(input.startDate);
const maxEndDate = toYyyyMmDd(addDays(startDate, MAX_RANGE_DAYS - 1));

if (input.endDate > maxEndDate) {
  alert('조회 종료일은 시작일로부터 최대 31일까지만 가능합니다.');
  return false;
}

      return true;
    }

    function buildRequestUrl(input) {
      return (
        GAS_URL +
        '?provider=' + encodeURIComponent(input.provider) +
        '&model=' + encodeURIComponent(input.model) +
        '&icao=' + encodeURIComponent(input.icao) +
        '&startDate=' + encodeURIComponent(input.startDate) +
        '&endDate=' + encodeURIComponent(input.endDate)
      );
    }


    /****************************************************
     * RENDER
     ****************************************************/

    function renderRows(rows, input) {
      const tbody = document.getElementById('resultBody');
      tbody.innerHTML = '';

      currentRows = [];

      if (!rows || rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="empty">결과가 없습니다.</td></tr>';
        return;
      }

      for (const r of rows) {
        const tr = document.createElement('tr');

        const rowData = {
          date: r.date || '',
          icao: r.icao || input.icao || '',
          fbo: r.fbo || r.provider || input.provider || '',
          model: r.model || input.model || '',
          handlingFee: formatMoneyOrText(r.handlingFee),
          minimumGallon: formatNumberOrText(r.minimumGallon),
          specialEventFee: formatMoneyOrText(r.specialEventFee)
        };

        currentRows.push(rowData);

        tr.innerHTML = `
          <td>${esc(rowData.date)}</td>
          <td>${esc(rowData.icao)}</td>
          <td>${esc(rowData.fbo)}</td>
          <td>${esc(rowData.model)}</td>
          <td class="num">${rowData.handlingFee}</td>
          <td class="num">${rowData.minimumGallon}</td>
          <td class="num">${rowData.specialEventFee}</td>
        `;

        tbody.appendChild(tr);
      }
    }

    function renderError(message) {
      const tbody = document.getElementById('resultBody');

      currentRows = [];

      tbody.innerHTML = `
        <tr>
          <td colspan="7" class="error-text">${esc(message)}</td>
        </tr>
      `;
    }

    function setStatus(message, type) {
      const status = document.getElementById('status');
      status.className = 'status';

      if (type) {
        status.classList.add(type);
      }

      status.innerHTML = message || '';
    }




    async function downloadPdf() {
      if (!currentRows || currentRows.length === 0) {
        alert('PDF로 추출할 조회 결과가 없습니다.');
        return;
      }

      if (!window.jspdf || !window.jspdf.jsPDF) {
        alert('PDF 라이브러리를 불러오지 못했습니다. 인터넷 연결 또는 회사 보안망/CDN 차단 여부를 확인하세요.');
        return;
      }

      const input = getInputValues();

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({
        orientation: 'landscape',
        unit: 'mm',
        format: 'a4'
      });

doc.setFontSize(15);
doc.text('FBO Fee Lookup Result', 14, 12);

doc.setFontSize(9);
doc.text(`ICAO: ${input.icao}`, 14, 19);
doc.text(`FBO: ${input.provider}`, 55, 19);
doc.text(`Aircraft: ${input.model}`, 105, 19);
doc.text(`Period: ${input.startDate} ~ ${input.endDate}`, 150, 19);
     

  const head = [[
  'Date',
  'ICAO',
  'FBO',
  'Aircraft',
  'Handling Fee',
  'Minimum Gallon',
  'Special Event Fee'
]];

      const body = currentRows.map(r => [
        r.date,
        r.icao,
        r.fbo,
        r.model,
        stripHtml(r.handlingFee),
        stripHtml(r.minimumGallon),
        stripHtml(r.specialEventFee)
      ]);

      doc.autoTable({
        head: head,
        body: body,
        startY: 24,
        theme: 'grid',
        styles: {
          fontSize: 9,
          cellPadding: 2,
          halign: 'center',
          valign: 'middle'
        },
        headStyles: {
          fillColor: [240, 243, 247],
          textColor: [40, 40, 40],
          halign: 'center'
        },
        margin: {
          left: 14,
          right: 14
        }
      });

      const fileName =
        'FBO_Fee_LOOKUP_' +
        sanitizeFileName(input.provider) + '_' +
        sanitizeFileName(input.icao) + '_' +
        sanitizeFileName(input.model) + '_' +
        input.startDate + '_' +
        input.endDate +
        '.pdf';

doc.save(fileName);
    }


    /****************************************************
     * FORMAT
     ****************************************************/

    function normalizeDisplayValue(v) {
      if (v === null || v === undefined || v === '') return '';

      const text = String(v).trim();

      if (
        text.toLowerCase() === 'price unavailable' ||
        text.toLowerCase() === 'unavailable' ||
        text.toLowerCase() === 'null'
      ) {
        return 'N/A';
      }

      return v;
    }

    function formatMoneyOrText(v) {
      v = normalizeDisplayValue(v);

      if (v === null || v === undefined || v === '') return '';

      if (v === 'N/A') return 'N/A';

      const n = Number(v);

      if (isNaN(n)) {
        return esc(v);
      }

      return '$' + n.toLocaleString();
    }

    function formatNumberOrText(v) {
      v = normalizeDisplayValue(v);

      if (v === null || v === undefined || v === '') return '';

      if (v === 'N/A') return 'N/A';

      const n = Number(v);

      if (isNaN(n)) {
        return esc(v);
      }

      return n.toLocaleString();
    }

    function parseDateLocal(value) {
      const parts = value.split('-');
      return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    }

    function addDays(date, days) {
      const d = new Date(date);
      d.setDate(d.getDate() + days);
      return d;
    }

    function toYyyyMmDd(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');

      return `${yyyy}-${mm}-${dd}`;
    }

    function esc(v) {
      return String(v === null || v === undefined ? '' : v)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function stripHtml(v) {
      const div = document.createElement('div');
      div.innerHTML = v;
      return div.textContent || div.innerText || '';
    }

    function sanitizeFileName(v) {
      return String(v || '')
        .replace(/[\\/:*?"<>|]/g, '_')
        .replace(/\s+/g, '_');
    }

  
  </script>
